[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "letterboxd-genre-prediction"
version = "0.1.0"
description = "Five-label genre prediction from Letterboxd film descriptions"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn==1.6.1",
  "scipy>=1.11",
  "joblib>=1.3",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
